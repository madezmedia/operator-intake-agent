services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  # Optional local memory backend for development.
  # Production uses the shared ACMI layer.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - agent-redis:/data

volumes:
  agent-redis:
